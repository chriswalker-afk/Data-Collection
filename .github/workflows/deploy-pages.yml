name: Publish Sampling Arcade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p dist/src dist/content
          cp index.html styles.css favicon.svg dist/
          cp src/*.js dist/src/
          cp content/concepts.json content/cloze.json content/evaluations.json content/sort-rounds.json content/scenarios.json content/methods.json content/accepted-terms.json dist/content/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
