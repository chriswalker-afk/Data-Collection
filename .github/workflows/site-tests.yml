name: Test Sampling Arcade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: sampling-arcade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-and-content:
    name: Content and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Verify publish artifact and all local page assets
        run: node scripts/build-pages.mjs
  multiplayer-fast:
    name: Fast multiplayer regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      # Ubuntu runners already have required shared libraries; avoid slow optional font apt downloads.
      - run: npx playwright install chromium
      - run: npx playwright test tests/browser/multiplayer.spec.js tests/browser/multiplayer-modes.spec.js tests/browser/multiplayer-ceremony.spec.js tests/browser/multiplayer-teams.spec.js tests/browser/arcade-unified.spec.js --project=desktop-chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-arcade-multiplayer-fast-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  browser:
    name: Chromium browser tests
    runs-on: ubuntu-latest
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run test:e2e
      # A small set of synthetic-data layout captures for human visual review.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-arcade-ui-pass3-layouts
          path: test-results/**/ui-pass3-*.png
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-arcade-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  multiplayer-staging:
    name: Cloudflare staging multiplayer smoke
    runs-on: ubuntu-latest
    needs: [unit-and-content]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployed Cloudflare room, WebSocket and server scoring
        run: node scripts/multiplayer-smoke.mjs
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
      - name: Verify cosmetic avatar protocol on staging
        run: node scripts/multiplayer-avatar-smoke.mjs
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev

  critter-visual:
    name: Critter Lab 45-player visual and accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install chromium
      - name: Test real critters, mobile layouts, motion and class finale
        run: npx playwright test tests/browser/multiplayer-critter-polish.spec.js --project=desktop-chromium --workers=1
        env:
          CRITTER_VISUAL_AUDIT: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critter-lab-projector-and-mobile-previews
          path: test-results/ui-pass3-critter-*.png
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critter-lab-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7


  blitz-staging-revision:
    name: Exact-revision Blitz Cloudflare staging smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/multiplayer-blitz-pass2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated staging deployed from this exact PR head
        env:
          MULTIPLAYER_API: https://sampling-arcade-races-pass3-test.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/multiplayer-blitz-smoke.mjs


  race-staging-revision:
    name: Exact-revision Bullseye and Perfect Run staging smoke
    if: github.event_name == 'pull_request' && (github.head_ref == 'feature/multiplayer-bullseye-perfect-run-pass3' || github.head_ref == 'feature/multiplayer-blitz-pass2')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove deployed race Worker matches this pull request SHA
        env:
          MULTIPLAYER_API: https://sampling-arcade-races-pass3-test.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/multiplayer-race-smoke.mjs
