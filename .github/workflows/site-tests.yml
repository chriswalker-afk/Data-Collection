name: Test Sampling Arcade
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-content:
    name: Content and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run check
  multiplayer-fast:
    name: Fast multiplayer regression
    runs-on: ubuntu-latest
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/multiplayer.spec.js tests/browser/arcade-unified.spec.js --project=desktop-chromium
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-arcade-multiplayer-fast-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  browser:
    name: Chromium browser tests
    runs-on: ubuntu-latest
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # A small set of synthetic-data layout captures for human visual review.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-arcade-ui-pass3-layouts
          path: test-results/**/ui-pass3-*.png
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sampling-arcade-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  multiplayer-staging:
    name: Cloudflare staging multiplayer smoke
    runs-on: ubuntu-latest
    needs: [unit-and-content]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployed Cloudflare room, WebSocket and server scoring
        run: node scripts/multiplayer-smoke.mjs
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
