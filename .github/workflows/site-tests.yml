name: Test Sampling Arcade
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits replace obsolete runs for the same PR or branch.
concurrency:
  group: sampling-arcade-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-content:
    name: Content and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate all mathematical content, source syntax and unit tests
        run: npm run check
      - name: Verify real Pages publish artifact and private Worker exclusion
        run: node scripts/build-pages.mjs

  browser-shard:
    name: Chromium browser shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # No 'needs': start full browser coverage immediately and in parallel.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Chromium browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Full desktop and mobile test coverage (this shard)
        run: npx playwright test --shard=${{ matrix.shard }}/3
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-ui-layouts-shard-${{ matrix.shard }}
          path: test-results/**/ui-pass3-*.png
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: arcade-browser-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the previous required status name while retaining all three shards.
  browser:
    name: Chromium browser tests
    if: always()
    needs: browser-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All desktop and mobile shards must succeed
        env:
          BROWSER_RESULT: ${{ needs.browser-shard.result }}
        run: test "$BROWSER_RESULT" = "success"

  multiplayer-staging:
    name: Cloudflare staging multiplayer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Compatibility of the *currently deployed* staging service, not PR SHA.
    # A separate manual workflow verifies and deploys an exact Worker revision.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployed staging room, WebSocket and server scoring
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
        run: node scripts/multiplayer-smoke.mjs
      - name: Verify cosmetic avatar protocol on deployed staging
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
        run: node scripts/multiplayer-avatar-smoke.mjs

  # Distinct audit enables image capture and exercises 45-player projector
  # and keyboard/mobile combinations absent from ordinary lightweight smokes.
  critter-visual:
    name: Critter Lab 45-player visual and accessibility audit
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Cache Chromium browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium
      - name: Test real critters, mobile layouts, motion and class finale
        env:
          CRITTER_VISUAL_AUDIT: '1'
        run: npx playwright test tests/browser/multiplayer-critter-polish.spec.js --project=desktop-chromium --workers=1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critter-lab-projector-and-mobile-previews
          path: test-results/ui-pass3-critter-*.png
          if-no-files-found: ignore
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: critter-lab-browser-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7


  mosaic-staging-revision:
    name: Exact-revision Puzzle Relay Cloudflare staging smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/multiplayer-puzzle-relay-mosaic-pass5'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact Worker SHA and complete the six-tile cooperative mosaic
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/multiplayer-mosaic-smoke.mjs
      - name: Protect original classroom protocol on upgraded staging
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
        run: node scripts/multiplayer-smoke.mjs

  class-quest-staging-revision:
    name: Exact-revision Class Quest Cloudflare staging smoke
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/multiplayer-class-quest-pass4'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: unit-and-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact revision and four real cooperative objectives
        env:
          MULTIPLAYER_API: https://sampling-arcade-class-quest-pass4-test.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/multiplayer-class-quest-smoke.mjs
