name: Verify Sampling Arcade custom-domain multiplayer
on:
  pull_request:
    paths:
      - .github/workflows/verify-domain-backend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-backend:
    name: Live staging and production origin compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging accepts legacy and custom domain origins
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
        run: node scripts/verify-multiplayer-origins.mjs
      - name: Verify production accepts legacy and custom domain origins
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer.chris-walker-d8b.workers.dev
        run: node scripts/verify-multiplayer-origins.mjs
      - name: Verify production room, WebSocket, and server-side grading
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer.chris-walker-d8b.workers.dev
        run: node scripts/multiplayer-smoke.mjs
