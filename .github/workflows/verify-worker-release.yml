name: Verify exact-revision Cloudflare Worker

# Explicit security/release gate. Normal PRs never attempt to deploy a Worker
# using missing GitHub secrets, and cannot silently pass a stale staging URL.
# Once the credentials are configured, select the feature branch and Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

# A single shared staging Worker must never be overwritten by parallel runs.
concurrency:
  group: sampling-arcade-worker-staging
  cancel-in-progress: false

jobs:
  verify:
    name: Exact-revision Worker staging release verification
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Require real Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID Actions secrets before Worker release verification."
            exit 1
          fi
      - name: Deploy precisely this Git commit to the isolated staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config multiplayer/wrangler.stage.jsonc --var BUILD_SHA:${{ github.sha }}
      - name: Prove deployed staging matches selected revision
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/staging-revision-check.mjs
      - name: Validate real room creation, reconnect, websocket and server grading
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
        run: node scripts/multiplayer-smoke.mjs
      - name: Validate avatar and classroom protocol
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
        run: node scripts/multiplayer-avatar-smoke.mjs
      - name: Validate all four self-paced Blitz question types
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/multiplayer-blitz-smoke.mjs
      - name: Validate rolling Bullseye and Perfect Run race objectives
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/multiplayer-race-smoke.mjs
      - name: Validate Class Quest's four cooperative goals and participation
        env:
          MULTIPLAYER_API: https://sampling-arcade-multiplayer-stage.chris-walker-d8b.workers.dev
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: node scripts/multiplayer-class-quest-smoke.mjs
